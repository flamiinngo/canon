[package]
name = "canon-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bootstate/canon"
description = "Keyless per-work vault for Canon. Obeys only the registry."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.86.0"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
