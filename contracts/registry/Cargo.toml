[package]
name = "canon-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bootstate/canon"
description = "Canon registry: NEP-171 works with lineage, approvals, clearance, licensing and lineage payouts."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
