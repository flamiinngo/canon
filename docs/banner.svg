<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#a98bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="0.35" stop-color="#ffb35c"/>
      <stop offset="0.7" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#52d6ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1280" height="520" fill="#07080a"/>
  <rect width="1280" height="520" fill="url(#grid)"/>
  <rect width="1280" height="520" fill="url(#glow)"/>

  <!-- Wordmark -->
  <g transform="translate(72 72)">
    <rect width="40" height="40" rx="11" fill="#0f1115" stroke="#ffffff" stroke-opacity="0.15"/>
    <path d="M20 11 V20 M20 20 L12 28 M20 20 L28 28" stroke="url(#spec)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="20" cy="11" r="3.6" fill="#ff6a3d"/>
    <circle cx="12" cy="29" r="3" fill="#a98bff"/>
    <circle cx="28" cy="29" r="3" fill="#52d6ff"/>
    <text x="56" y="29" font-size="26" font-weight="700" fill="#eef0f3" letter-spacing="-1">canon</text>
  </g>

  <text x="72" y="210" font-size="64" font-weight="700" fill="#eef0f3" letter-spacing="-3">Creative IP that pays</text>
  <text x="72" y="282" font-size="64" font-weight="700" fill="url(#spec)" letter-spacing="-3">its whole family tree.</text>
  <text x="72" y="336" font-size="21" fill="#a3a9b4">Every work is a NEAR NFT with its own keyless vault.</text>
  <text x="72" y="366" font-size="21" fill="#a3a9b4">One licence payment splits across every generation, in one transaction.</text>

  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#6b717c">
    <text x="72" y="452">NEAR testnet · canonhq.testnet · 0 access keys · NEP-171 · 199 · 591</text>
  </g>

  <!-- Lineage -->
  <g transform="translate(900 0)">
    <path d="M150 150 C150 230, 70 230, 70 300" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" fill="none"/>
    <path d="M150 150 C150 230, 230 230, 230 300" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" fill="none"/>
    <path d="M70 340 V410" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" fill="none"/>
    <path d="M70 410 V340 C70 270, 150 230, 150 160" stroke="url(#spec)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="150" cy="120" r="44" fill="#ff6a3d" opacity="0.25" filter="url(#soft)"/>
    <circle cx="150" cy="120" r="30" fill="#1a120e" stroke="#ff6a3d" stroke-width="2.5"/>
    <circle cx="70" cy="320" r="24" fill="#16121f" stroke="#a98bff" stroke-width="2.5"/>
    <circle cx="230" cy="320" r="24" fill="#10131f" stroke="#a98bff" stroke-width="2.5"/>
    <circle cx="70" cy="430" r="24" fill="#0e161a" stroke="#52d6ff" stroke-width="2.5"/>
    <g font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700">
      <rect x="190" y="106" width="76" height="26" rx="13" fill="#eef0f3"/><text x="228" y="124" text-anchor="middle" fill="#07080a">+0.075</text>
      <rect x="104" y="306" width="72" height="26" rx="13" fill="#eef0f3"/><text x="140" y="324" text-anchor="middle" fill="#07080a">+0.30</text>
      <rect x="104" y="416" width="76" height="26" rx="13" fill="#eef0f3"/><text x="142" y="434" text-anchor="middle" fill="#07080a">+1.125</text>
    </g>
    <g font-size="12" fill="#a3a9b4" text-anchor="middle">
      <text x="150" y="172">original</text>
      <text x="70" y="362" dx="-58">3D relief</text>
      <text x="230" y="362">colourway</text>
      <text x="70" y="472">motion · 1.5 Ⓝ licence</text>
    </g>
  </g>
</svg>
